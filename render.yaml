services:
  - type: web
    name: novatech-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CYBERSENTINEL_API_URL
        value: https://cybersentinel-backend-6zr9.onrender.com/api/traffic-events
